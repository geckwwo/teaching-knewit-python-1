<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Что угодно</title>
    <style>
        .block {
            background-color: white;
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 2px 2px 5px darkgray;
            
        }

        .block-text {
            font-size: larger;
            margin-bottom: 12px;
        }

        .block-date {
            font-size: small;
            color: gray;
        }

        body {
            font-family: Arial, Helvetica, sans-serif; 
            background-color: #719ebf;
        }

        .profile {
            background-color: white;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 18px;
        }

        .circle {
            width: 36px;
            aspect-ratio: 1;
            border-radius: 99999px;
            border: 1px solid black;
            background-color: red;
        }

        .profile-row1 {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="block">
        <div>Очень крутая соцсеть</div>
    </div>
</body>
</html>
