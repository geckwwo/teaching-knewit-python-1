<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Что угодно</title>
    <style>
        .block {
            background-color: white;
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 2px 2px 5px darkgray;
            
        }

        .block-text {
            font-size: larger;
            margin-bottom: 12px;
        }

        .block-date {
            font-size: small;
            color: gray;
        }

        body {
            font-family: Arial, Helvetica, sans-serif; 
            background-color: #719ebf;
        }

        .profile {
            background-color: white;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 18px;
        }

        .circle {
            width: 36px;
            aspect-ratio: 1;
            border-radius: 99999px;
            border: 1px solid black;
            background-color: red;
        }

        .profile-row1 {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .button-new-post {
            background-color: #719ebf;
            border: 0;
            border-radius: 8px;
            padding: 8px;
            margin-top: 4px;
        }
    </style>

    <script>
        function create_post() {
            const postTitle = prompt("Введите пост:")
            fetch("/posts/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: postTitle,
                    likes: 0,
                    date: new Date().toISOString(),
                    user: Number("{{ id }}")
                })
            })
        }
    </script>
</head>
<body>
    <div class="block">
        <div class="profile-row1">
            <div class="circle"></div>
            <div>
                {% if name %}
                    <div class="profile-name">{{ name }}</div>
                {% else %}
                    <div class="profile-name">{{ tag }}</div>
                {% endif %}
                
                <div class="profile-tag">@{{ tag }} (id: {{ id }})</div>
            </div>
        </div>
        <div class="profile-join-date">Присоединился {{ date_joined }}</div>
        <div class="profile-subs">0 подписок, 0 подписчиков</div>

        <button class="button-new-post" onclick="create_post();">+ Новый пост</button>
    </div>
    
    {% for item in posts %}
    <div class="block">
        <div class="block-text">{{ item.title }}</div>
        <div class="block-date">{{ item.date }}</div>
    </div>
    {% endfor %}
</body>
</html>
